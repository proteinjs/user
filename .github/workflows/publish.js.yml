name: Publish User Packages

on:
  push:
    branches:
      - main

# One publish at a time: two overlapping runs race at the publish step — the earlier run's
# release commit rebases onto the later push and stamps a version/tag whose git history COVERS
# the later commit, while publishing the tarball built from its own older checkout; the later
# run then sees "no changed packages" and the newer code never ships (bit the thought repo
# 2026-07-23 thought-common 3.15.3 and 2026-08-13 thought-ui 3.33.0). The concurrency group
# serializes publish jobs; the "Abort if main advanced" guard closes the remaining window —
# only the run whose checkout is still the branch tip publishes, and the tip push's own run
# releases everything pending.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
      # user-server's Spanner integration suites (Roles + BackfillUserRolesArray, added with the
      # roles cutover a296657) self-provision instance+database over the emulator's gRPC admin
      # API — no gcloud steps or 9020 REST port needed, just the address.
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator
        ports:
          - 9010:9010
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Configure git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
  
      - name: CI glue self-test (LockFloors.js)
        # node:test, needs no install; fails the job before any minute is spent on install/build.
        run: node --test .github/scripts/LockFloors.test.js

      - name: Setup NPM authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check NPM token validity
        run: |
          if ! npm_output=$(npm org ls proteinjs --json 2>&1); then
            echo "NPM token validation failed. Error details:"
            echo "$npm_output"
            exit 1
          fi
      
      - name: Install root package
        run: |
          npm i
      
      - name: Build packages
        run: |
          npm run build-workspace

      - name: Test packages
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: ""
          MYSQL_DATABASE: test
        run: |
          npm run test-workspace

      # The stale-checkout guard (see race note at top). Runs AFTER the long install/build/test
      # steps so the unguarded window shrinks from ~30 minutes to the seconds between this check
      # and lerna's push.
      - name: Abort if main advanced (stale-checkout guard)
        id: tip
        run: |
          git fetch origin main --quiet
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "origin/main advanced past this run's checkout — skipping version+publish; the tip push's run releases everything pending (see race note at top of the workflow)."
          fi

      - name: Commit package-locks
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          git add .
          if git diff --staged --exit-code; then
            echo "No changes to commit."
          else
            git commit -m "chore(version) update package-locks [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      - name: Version and Publish
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          npx lerna publish --yes --no-private
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Re-stamp the consumer locks for the mint
        # lerna's release commit raises each sibling consumer's floor when a package it depends on
        # is published from this repo (packages/server, packages/ui: `@proteinjs/user` ^1.19.2 ->
        # ^1.20.0) and mirrors the range into the lock's root block — lerna 8.1.2's
        # update-lockfile-version.js is a JSON rewrite, and its only `npm install
        # --package-lock-only` runs on the ROOT lock, which declares no package. The lock's
        # INSTALLED entry — the pre-publish stamp the build's `npm i` wrote and the lock commit
        # above shipped — stays at the old version, so main refuses `npm ci` in every consumer
        # (EUSAGE: "lock file's @proteinjs/user@1.19.2 does not satisfy @proteinjs/user@1.20.0")
        # until someone re-stamps by hand. Now that the registry serves the mint: LockFloors.js
        # --restamp resolves the torn trees only (`npm i --package-lock-only` with this job's npm 10
        # — lock stamps are npm-major dependent), proves every tree coherent, and the locks ride
        # main as the mint's second commit; a mint that moved no consumer floor commits nothing.
        # Best-effort by design (continue-on-error): the packages are published, so a registry still
        # not serving the mint after three rounds leaves main as lerna left it, this step red, the
        # job green; `node .github/scripts/LockFloors.js --restamp` under npm 10, committed, is the
        # hand recipe.
        if: steps.tip.outputs.is_tip == 'true'
        continue-on-error: true
        run: |
          node .github/scripts/LockFloors.js --restamp
          git add -u -- package-lock.json '*/package-lock.json'
          if git diff --staged --quiet; then
            echo "every lock agrees with the mint — nothing to commit."
          else
            git commit -m "chore(locks): consumer locks re-stamped for the mint [skip ci]"
            git push origin HEAD:main
          fi
